<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Song erraten – Spielleiter</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../public-client.js"></script><script src="songs.js"></script></head><body><div class="wrap"><div class="title">SONG ERRATEN</div><div class="sub">Spielleiter</div><div class="panel"><div class="row"><button class="btn" id="new">Neuer Song</button><button class="btn alt" id="play">Ausschnitt abspielen</button><button class="btn alt" id="next">Nächste Stufe</button><button class="btn good" id="right">Richtig</button><button class="btn bad" id="wrong">Falsch</button><button class="btn alt" id="reveal">Auflösen</button></div><div class="phase" id="phase">0,5 SEKUNDEN</div><div class="status" id="status">Bereit</div></div><div class="panel"><div class="song" id="song">—</div><div class="answer hidden" id="answer"></div><div class="status">Skip: <span class="skipcount" id="skip">0/0</span></div></div><div class="panel"><h3>Spieler</h3><div class="players" id="players"></div></div><audio id="audio" preload="auto"></audio></div><script src="common.js"></script><script>
let timer=null;function cur(){return (window.SONGS||[])[state?.songIndex]||null}function render(){const ps=players(),ph=PHASES[state?.phaseIndex||0]||.5, c=cur();document.getElementById('phase').textContent=String(ph).replace('.',',')+' SEKUNDEN';document.getElementById('song').textContent=c?(c.category||'Song'):'—';document.getElementById('answer').textContent=c?c.artist+' – '+c.title:'';document.getElementById('answer').classList.toggle('hidden',!state?.revealed);document.getElementById('skip').textContent=Object.keys(state?.skipVotes||{}).length+'/'+activePlayers().length;document.getElementById('status').textContent=state?.buzzedBy?(state.buzzedBy+' hat gebuzzert'):(state?.playing?'Ausschnitt läuft':'Bereit');document.getElementById('players').innerHTML=ps.map(p=>`<div class="player ${state?.buzzedBy===p.name?'active':''}"><b>${esc(p.name)}</b><span class="score">${p.score||0} P</span><div>${p.locked?'Für diesen Song gesperrt':'Bereit'}</div></div>`).join('')}
async function persist(p){await saveState({...state,...p});render()}async function play(){const c=cur();if(!c)return;const a=document.getElementById('audio'),secs=PHASES[state.phaseIndex||0];clearTimeout(timer);a.src=c.src;a.currentTime=Number(c.start||0);a.volume=.35;await persist({playing:true});try{await a.play();timer=setTimeout(async()=>{a.pause();await persist({playing:false})},secs*1000)}catch(e){await persist({playing:false});document.getElementById('status').textContent='Audio konnte nicht abgespielt werden: '+e.message}}
document.getElementById('new').onclick=async()=>{if(!SONGS.length)return;const used=Array.isArray(state.used)?state.used:[];let pool=SONGS.map((_,i)=>i).filter(i=>!used.includes(i));if(!pool.length)pool=SONGS.map((_,i)=>i);const i=pool[Math.floor(Math.random()*pool.length)];const np={...(state.players||{})};Object.keys(np).forEach(n=>{np[n]={...np[n],locked:false}});await persist({songIndex:i,phaseIndex:0,skipVotes:{},buzzedBy:null,revealed:false,playing:false,players:np,used:[...used,i].slice(-SONGS.length)});document.getElementById('audio').pause()};
document.getElementById('play').onclick=play;document.getElementById('next').onclick=async()=>{await persist({phaseIndex:Math.min(3,(state.phaseIndex||0)+1),skipVotes:{},buzzedBy:null,playing:false});document.getElementById('audio').pause()};document.getElementById('right').onclick=async()=>{if(!state.buzzedBy)return;const pts=4-(state.phaseIndex||0),np={...(state.players||{})},n=state.buzzedBy;np[n]={...np[n],score:Number(np[n]?.score||0)+pts};await persist({players:np,revealed:true,playing:false});document.getElementById('audio').pause()};document.getElementById('wrong').onclick=async()=>{if(!state.buzzedBy)return;const np={...(state.players||{})},n=state.buzzedBy;np[n]={...np[n],locked:true};await persist({players:np,buzzedBy:null,playing:false});document.getElementById('audio').pause()};document.getElementById('reveal').onclick=()=>persist({revealed:true,playing:false});
loadState().then(()=>{render();subscribe(render)}).catch(e=>document.getElementById('status').textContent='Song-Modus DB fehlt: '+e.message);
</script><script src="../active-stream-mode.js"></script></body></html>
