<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guess The Song · Spielleitung</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../public-client.js"></script><script src="../drama-audio.js?v=20261120-timer"></script><link rel="stylesheet" href="../studio.css?v=63"><link rel="stylesheet" href="guess.css?v=guess-search-v7"></head><body data-format="songerraten" class="director"><header class="director-head"><a href="./">← Zurück</a><h1>Guess The Song</h1><span>Spielleitung</span></header><main class="director-grid"><section class="studio-card"><h2>Musik</h2><label>MP3, WAV, OGG oder M4A<input id="files" type="file" accept="audio/*" multiple></label><div class="song-list" id="songList"></div><label>Optionaler Spotify-Link<input id="spotify" type="url" placeholder="https://open.spotify.com/track/…"></label><button id="spotifyOpen" class="secondary">Spotify öffnen</button><p class="note">Spotify läuft separat in deinem Browser. Die automatische Wiedergabe ist nicht garantiert.</p><audio id="player" controls preload="metadata"></audio><div class="actions"><button id="play">▶ Abspielen</button><button id="pause" class="secondary">Pause</button></div></section><section class="studio-card"><h2>Runde</h2><label>Regieschlüssel<input id="directorKey" type="password" autocomplete="off" placeholder="Aus der Datenbankeinrichtung"></label><label>Songtitel (nur Spielleitung)<input id="title" placeholder="Titel"></label><label>Interpret (nur Spielleitung)<input id="artist" placeholder="Interpret"></label><label>Timer in Sekunden<input id="seconds" type="number" min="5" max="600" value="30"></label><div class="actions"><button id="new">Neue Runde</button><button id="start">Timer starten</button><button id="stop" class="secondary">Timer pausieren</button><button id="reveal" class="secondary">Auflösung</button></div><h3>Buzz-Reihenfolge</h3><div id="queue" class="song-list"></div><div class="actions"><button id="correct">Richtig +1</button><button id="wrong" class="danger">Falsch −1</button><button id="resetbuzz" class="secondary">Buzzer freigeben</button></div></section><section class="studio-card full"><h2>Spieler & Punkte</h2><div id="status" class="note"></div><div id="players"></div><div class="actions"><input id="addName" placeholder="Spielername"><button id="add">Hinzufügen</button></div></section></main><script src="katalog.js?v=guess-v5"></script><script src="song.js?v=guess-search-v7"></script><script src="../active-stream-mode.js?v=20261121-v2-switch"></script></body></html>
