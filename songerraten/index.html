<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Song erraten</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../public-client.js"></script><link rel="stylesheet" href="../show-camera.css?v=73"></head><body><div class="wrap"><div class="title">SONG ERRATEN</div><div id="join" class="panel join"><h2>Mitspielen</h2><input id="name" maxlength="30" placeholder="Dein Name"><button class="btn big" id="joinBtn">Beitreten</button><div class="status" id="joinStatus"></div></div><div id="game" class="hidden"><div class="panel"><div class="phase" id="phase">0,5 SEKUNDEN</div><div class="status" id="status">Warte auf den Spielleiter…</div><div class="controls"><button class="btn big" id="buzz">BUZZ</button><button class="btn alt big" id="skip">SKIP</button></div><div class="status">Skip: <span class="skipcount" id="skipcount">0/0</span></div></div><div class="players" id="players"></div></div></div><script src="common.js"></script><script>
let me=sessionStorage.getItem('song_name')||'';function render(){if(!state)return;const p=state.players?.[me];if(!p)return;document.getElementById('phase').textContent=String(PHASES[state.phaseIndex||0]).replace('.',',')+' SEKUNDEN';document.getElementById('status').textContent=state.revealed?'Song wurde aufgelöst':state.buzzedBy?(state.buzzedBy+' antwortet'):'Bereit';document.getElementById('buzz').disabled=!!state.buzzedBy||!!p.locked||state.revealed;document.getElementById('skip').disabled=!!state.buzzedBy||state.revealed||!!state.skipVotes?.[me];document.getElementById('skipcount').textContent=Object.keys(state.skipVotes||{}).length+'/'+activePlayers().length;document.getElementById('players').innerHTML=players().map(x=>`<div class="player ${state.buzzedBy===x.name?'active':''}"><b>${esc(x.name)}</b><span class="score">${x.score||0} P</span></div>`).join('')}
async function enter(){me=document.getElementById('name').value.trim();if(!me)return;try{await loadState();const np={...(state.players||{})};np[me]={...(np[me]||{}),score:Number(np[me]?.score||0),active:true,locked:false};await saveState({...state,players:np});sessionStorage.setItem('song_name',me);document.getElementById('join').classList.add('hidden');document.getElementById('game').classList.remove('hidden');render();subscribe(render)}catch(e){document.getElementById('joinStatus').textContent='Verbindung fehlgeschlagen: '+e.message}}
document.getElementById('joinBtn').onclick=enter;document.getElementById('buzz').onclick=async()=>{const {data,error}=await sb.rpc('song_buzz',{p_name:me});if(error){document.getElementById('status').textContent='Buzz fehlgeschlagen: '+error.message;return}state=data||state;render()};document.getElementById('skip').onclick=async()=>{const {data,error}=await sb.rpc('song_skip_vote',{p_name:me});if(error){document.getElementById('status').textContent='Skip fehlgeschlagen: '+error.message;return}state=data||state;render()};if(me){document.getElementById('name').value=me;enter()}
</script><script src="../camera-config.js"></script><script src="../show-camera.js?v=73"></script></body></html>
