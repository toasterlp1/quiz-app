<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Song erraten – Stream</title><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../public-client.js"></script><script src="songs.js"></script><link rel="stylesheet" href="../show-camera.css?v=73"></head><body><div class="wrap"><div class="title">SONG ERRATEN</div><div class="phase" id="phase">0,5 SEKUNDEN</div><div class="status" id="status">Warte auf Song…</div><div class="panel"><div class="status">Skip: <span class="skipcount" id="skip">0/0</span></div><div class="answer hidden" id="answer"></div></div><div class="players" id="players"></div><audio id="audio" preload="auto"></audio></div><script src="common.js"></script><script>
let lastPlay=false;function render(){const c=(SONGS||[])[state?.songIndex];document.getElementById('phase').textContent=String(PHASES[state?.phaseIndex||0]).replace('.',',')+' SEKUNDEN';document.getElementById('status').textContent=state?.buzzedBy?(state.buzzedBy+' HAT GEBUZZERT'):'SONG LÄUFT';document.getElementById('skip').textContent=Object.keys(state?.skipVotes||{}).length+'/'+activePlayers().length;document.getElementById('answer').textContent=c?c.artist+' – '+c.title:'';document.getElementById('answer').classList.toggle('hidden',!state?.revealed);document.getElementById('players').innerHTML=players().map(p=>`<div class="player ${state?.buzzedBy===p.name?'active':''}"><b>${esc(p.name)}</b><span class="score">${p.score||0} P</span></div>`).join('');const a=document.getElementById('audio');if(state?.playing&&!lastPlay&&c){a.src=c.src;a.currentTime=Number(c.start||0);a.volume=.35;a.play().catch(()=>{})}if(!state?.playing&&lastPlay)a.pause();lastPlay=!!state?.playing}
loadState().then(()=>{render();subscribe(render)}).catch(()=>{});
</script><script src="../camera-config.js"></script><script src="../show-camera.js?v=73"></script></body></html>
