<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Streamer beitreten</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./public-client.js"></script><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;background:#090d18;color:#fff}body{display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 10%,#24325a 0,transparent 42%),#090d18}.card{width:min(440px,100%);padding:28px;border-radius:22px;background:rgba(16,23,42,.95);border:1px solid rgba(255,255,255,.14);box-shadow:0 24px 80px rgba(0,0,0,.45)}h1{font-size:24px;margin:0 0 8px}.sub{color:#98a4bb;font-size:13px;margin-bottom:18px}input{width:100%;padding:14px 15px;border-radius:12px;border:1px solid #34415f;background:#0c1221;color:#fff;font-size:16px;outline:none}button{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#6ee7ff,#6d5dfc);color:#07111d;font-weight:900;font-size:15px;cursor:pointer}.err{min-height:20px;color:#ff7d91;font-size:12px;margin-top:10px}</style></head><body><main class="card"><h1>Streamer beitreten</h1><div class="sub" id="fmt"></div><input id="name" maxlength="32" autocomplete="nickname" placeholder="Dein Name"><button id="join">Beitreten</button><div class="err" id="err"></div></main><script>
const q=new URLSearchParams(location.search);const format=(q.get('format')||'').trim();const target=(q.get('target')||((format||'')+'/host.html')).trim();document.getElementById('fmt').textContent=format?('Format: '+format):'';
async function go(){const input=document.getElementById('name');const n=window.KA_PUBLIC.normalizeName(input.value);if(!n||!format)return;const r=await window.KA_PUBLIC.registerPlayer(n,format);if(!r.ok){document.getElementById('err').textContent='Beitritt fehlgeschlagen.';return;}try{sessionStorage.setItem('ka_player_'+format,n);}catch(e){} location.href=new URL(target,location.href).href;}
document.getElementById('join').onclick=go;document.getElementById('name').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script></body></html>
