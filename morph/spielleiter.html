<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Morph — Spielleiter</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../eingabeschutz.js"></script>
<script src="../public-client.js"></script>
<script src="../server-time.js?v=48"></script>

<script src="../kern-render.js"></script>
<script src="./morphs.js"></script>
<style>
  :root{
    --bg:#0a0e1a; --panel:#12172a; --panel-border:#232b45;
    --ink:#eef1f8; --muted:#6b7488; --accent:#c44dff; --accent2:#ff4d9d; --warn:#ffd166; --bad:#ff3860; --good:#3ddc84;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;padding:24px;min-height:100vh;}
  h1{font-family:'Anton',sans-serif;letter-spacing:2px;margin:0 0 20px;font-size:28px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:1100px;margin:0 auto;}
  .card{background:var(--panel);border:1px solid var(--panel-border);border-radius:16px;padding:20px;}
  .card h2{font-size:15px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:0 0 14px;}
  button{font-family:'Inter',sans-serif;font-weight:700;border:none;border-radius:10px;padding:12px 18px;cursor:pointer;font-size:14px;transition:transform .1s, opacity .15s;}
  button:active{transform:scale(.96);}
  button:disabled{opacity:.35;cursor:not-allowed;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-warn{background:var(--warn);color:#241900;}
  .btn-good{background:var(--good);color:#04120c;}
  .btn-bad{background:var(--bad);color:#fff;}
  .btn-ghost{background:#1b2138;color:var(--ink);border:1px solid var(--panel-border);}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  input[type=text]{background:#0d1220;border:1px solid var(--panel-border);color:var(--ink);padding:10px 12px;border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;flex:1;}
  .status-line{font-size:14px;color:var(--muted);margin-bottom:14px;}
  .status-line b{color:var(--ink);}
  .answer-reveal{font-family:'Anton',sans-serif;font-size:18px;color:var(--warn);margin-top:6px;line-height:1.4;}
  .answer-reveal .vs{color:var(--muted);font-size:14px;margin:0 6px;}
  .queue{display:flex;flex-direction:column;gap:6px;margin-top:10px;}
  .queue-item{display:flex;justify-content:space-between;align-items:center;background:#0d1220;border:1px solid var(--panel-border);border-radius:8px;padding:8px 12px;}
  .queue-item.active{border-color:var(--warn);}
  .queue-item.out{opacity:.4;text-decoration:line-through;}
  .players{display:flex;flex-direction:column;gap:8px;}
  .player-row{display:flex;align-items:center;gap:10px;background:#0d1220;border:1px solid var(--panel-border);border-radius:8px;padding:8px 10px;}
  .player-row .name{flex:1;font-weight:700;}
  .player-row .score{font-family:'Anton',sans-serif;font-size:20px;color:var(--accent);min-width:36px;text-align:center;}
  .mini{padding:6px 10px;font-size:12px;}
  .step-hint{font-size:13px;color:var(--muted);margin:8px 0 4px;}
  @media (max-width:820px){
    body{padding:14px;}
    .grid{grid-template-columns:1fr;gap:14px;}
    button,select,input{min-height:40px;}
  }
</style>
<link rel="stylesheet" href="../responsive.css" />

</head>
<body>
<h1>MORPH — SPIELLEITER</h1>
<div class="grid">

  <div class="card">
    <h2>Runde</h2>
    <div class="status-line" id="statusLine">Kein Morph aktiv.</div>
    <div class="answer-reveal" id="answerReveal"></div>
    <div class="row">
      <button class="btn-primary" id="btnNewRound">Neuer Morph</button>
      <button class="btn-ghost" id="btnResetPool">Pool zurücksetzen</button>
    </div>

    <div class="step-hint">Auflösung schrittweise:</div>
    <div class="row">
      <button class="btn-warn" id="btnRevealA" disabled>Person A zeigen</button>
      <button class="btn-warn" id="btnRevealB" disabled>Person B zeigen</button>
    </div>

    <div class="row" style="margin-top:10px;">
      <button class="btn-ghost" id="btnLastChance" disabled>LAST CHANCE aktivieren</button>
    </div>
    <div class="step-hint" id="lcHint" style="margin-top:6px;">
      Standard: beide Personen nötig = 3 Punkte. Last Chance: eine Person reicht = 1 Punkt (beide einzeln holbar).
    </div>

    <h2 style="margin-top:20px;">Buzzer-Warteschlange</h2>
    <div class="queue" id="queue"><span style="color:var(--muted);">— niemand gebuzzert —</span></div>
    <div class="row" style="margin-top:14px;">
      <button class="btn-good" id="btnCorrect" disabled>Beide richtig (3 Pkt)</button>
      <button class="btn-good" id="btnOne" disabled>Eine richtig (1 Pkt)</button>
      <button class="btn-bad" id="btnWrong" disabled>Falsch</button>
    </div>
  </div>

  <div class="card">
    <h2>Spieler</h2>
    <div class="row">
      <input type="text" id="newPlayerName" placeholder="Name eingeben…" />
      <button class="btn-primary" id="btnAddPlayer">Hinzufügen</button>
    </div>
    <div class="players" id="players"></div>
  </div>

</div>

<script>
const sb = window.KA_SB;
const LEER = { players:{}, morphIndex:null, revealStartedAt:null, revealStep:0, buzzQueue:[], buzzedOut:[], usedIndices:[], frozenAt:null, lastChance:false, personenGeholt:0 };
let morphActionBusy = false;
let state = Object.assign({}, LEER);

// Spielerliste ruhig verwalten - kein Neuaufbau bei jedem Render.
const morphSpielerListe = KernRender.liste(document.getElementById('players'), {
  schluessel: ([name]) => name,
  erstellen: () => {
    const el = document.createElement('div');
    el.className = 'player-row';
    el.innerHTML = `
      <span class="name"></span>
      <button class="btn-ghost mini" data-adj="-1">−1</button>
      <span class="score"></span>
      <button class="btn-ghost mini" data-adj="1">+1</button>
      <button class="btn-bad mini" data-remove>Entfernen</button>`;
    return el;
  },
  aktualisieren: (el, [name, score]) => {
    KernRender.textWennGeaendert(el.querySelector('.name'), name);
    KernRender.textWennGeaendert(el.querySelector('.score'), score);
    el.querySelectorAll('[data-adj]').forEach(b => {
      b.onclick = async () => {
        state.players[name] = (state.players[name]||0) + parseInt(b.dataset.adj,10);
        await saveState();
      };
    });
    el.querySelector('[data-remove]').onclick = async () => {
      delete state.players[name];
      state.buzzQueue = state.buzzQueue.filter(x=>x!==name);
      state.buzzedOut = state.buzzedOut.filter(x=>x!==name);
      await saveState();
      try { await sb.rpc('deactivate_public_player', { p_name:name, p_format:'morph' }); } catch(e) {}
    };
  }
});

async function loadState(){
  const { data } = await sb.from('mo_state').select('state').eq('id',1).single();
  state = Object.assign({}, LEER, data?.state||{});
  render();
}
async function saveState(){
  await sb.from('mo_state').update({ state }).eq('id',1);
}
loadState();

sb.channel('mo_state_channel_sl')
  .on('postgres_changes', { event:'*', schema:'public', table:'mo_state' }, payload=>{
    state = Object.assign({}, LEER, payload.new.state || {});
    render();
  }).subscribe();

function activeBuzzer(){
  return state.buzzQueue.find(n=>!state.buzzedOut.includes(n));
}

function render(){
  const statusLine = document.getElementById('statusLine');
  const answerReveal = document.getElementById('answerReveal');
  const eintrag = (state.morphIndex!=null && MORPHS[state.morphIndex]) ? MORPHS[state.morphIndex] : null;
  const solved = state.revealStep >= 2;

  if(eintrag){
    const stepTxt = state.revealStep === 0 ? 'beide verdeckt' : (state.revealStep === 1 ? 'eine Person aufgedeckt' : 'komplett aufgelöst');
    const wert = state.lastChance
      ? 'LAST CHANCE — eine Person reicht (1 Punkt, beide einzeln holbar)'
      : 'Standard — beide Personen nötig (3 Punkte)';
    const geholt = state.personenGeholt ? ` — ${state.personenGeholt}/2 geholt` : '';
    statusLine.innerHTML = `Morph <b>#${state.morphIndex+1}</b> — <b>${wert}</b> — <b>${stepTxt}</b>${geholt}`;
    answerReveal.innerHTML = 'Lösung: <b>' + (eintrag.nameA||'?') + '</b><span class="vs">+</span><b>' + (eintrag.nameB||'?') + '</b>';
  } else {
    statusLine.textContent = (state.usedIndices && state.usedIndices.length>=MORPHS.length)
      ? 'Alle Morphs wurden gezeigt. Klick "Pool zurücksetzen".'
      : 'Kein Morph aktiv.';
    answerReveal.textContent = '';
  }

  const queueEl = document.getElementById('queue');
  if(state.buzzQueue.length===0){
    queueEl.innerHTML = '<span style="color:var(--muted);">— niemand gebuzzert —</span>';
  } else {
    const active = activeBuzzer();
    queueEl.innerHTML = state.buzzQueue.map(n=>{
      const out = state.buzzedOut.includes(n);
      const isActive = n===active;
      return `<div class="queue-item ${isActive?'active':''} ${out?'out':''}">${n}${isActive?' ← dran':''}</div>`;
    }).join('');
  }

  const active = activeBuzzer();
  const hatMorph = state.morphIndex!=null;
  // "Beide richtig" (3 Pkt) nur im Standard-Modus.
  document.getElementById('btnCorrect').disabled = !active || solved || !hatMorph || state.lastChance;
  // "Eine richtig" (1 Pkt) nur im Last-Chance-Modus.
  document.getElementById('btnOne').disabled = !active || solved || !hatMorph || !state.lastChance;
  document.getElementById('btnWrong').disabled = !active || solved || !hatMorph;
  document.getElementById('btnRevealA').disabled = !hatMorph || state.revealStep >= 1;
  document.getElementById('btnRevealB').disabled = !hatMorph || state.revealStep >= 2;
  // Last-Chance-Toggle
  const lc = document.getElementById('btnLastChance');
  lc.disabled = !hatMorph || solved;
  lc.textContent = state.lastChance ? 'LAST CHANCE aktiv ✓ (zurück zu Standard)' : 'LAST CHANCE aktivieren';
  lc.classList.toggle('btn-good', state.lastChance);

  morphSpielerListe.render(Object.entries(state.players));
}

document.getElementById('btnAddPlayer').onclick = async ()=>{
  const input = document.getElementById('newPlayerName');
  const name = input.value.trim();
  if(!name || state.players[name]!=null) return;
  state.players[name] = 0;
  input.value='';
  await saveState();
};
document.getElementById('newPlayerName').addEventListener('keydown', e=>{
  if(e.key==='Enter') document.getElementById('btnAddPlayer').click();
});

document.getElementById('btnNewRound').onclick = async ()=>{
  await loadState();
  const available=[...Array(MORPHS.length).keys()].filter(i=>!(state.usedIndices||[]).includes(i));
  if(!available.length){alert('Alle Morphs wurden gezeigt. Klick "Pool zurücksetzen".');return;}
  const idx=available[Math.floor(Math.random()*available.length)];
  const {data,error}=await sb.rpc('party_buzzer_new_round',{p_game:'morph',p_index:idx});
  if(error){console.error(error);return;} if(data?.state){state=data.state;render();}
};

document.getElementById('btnResetPool').onclick = async ()=>{
  const {data,error}=await sb.rpc('party_buzzer_reset_pool',{p_game:'morph'});
  if(!error && data){state=data;render();}
};

// Schrittweise Auflösung (auch ohne Buzzer nutzbar)
document.getElementById('btnRevealA').onclick = async ()=>{
  const {data,error}=await sb.rpc('party_buzzer_reveal',{p_game:'morph',p_action:'a'}); if(!error&&data){state=data;render();}
};
document.getElementById('btnRevealB').onclick = async ()=>{
  const {data,error}=await sb.rpc('party_buzzer_reveal',{p_game:'morph',p_action:'b'}); if(!error&&data){state=data;render();}
};

// LAST CHANCE manuell umschalten: ab jetzt reicht EINE Person = 1 Punkt,
// und beide Personen sind einzeln holbar.
document.getElementById('btnLastChance').onclick = async ()=>{
  if(state.morphIndex==null)return; const {data,error}=await sb.rpc('party_buzzer_reveal',{p_game:'morph',p_action:'toggle_last'}); if(!error&&data){state=data;render();}
};

// Beide Personen richtig genannt -> 3 Punkte, Runde aufgelöst.
document.getElementById('btnCorrect').onclick = async ()=>{
  if(morphActionBusy || state.morphIndex==null || state.revealStep>=2) return; morphActionBusy=true;
  try{const {data,error}=await sb.rpc('party_buzzer_judge',{p_game:'morph',p_outcome:'correct'}); if(error){console.error(error);return;} if(data?.state){state=data.state;render();} if(data?.accepted&&window.RUNDEN) await RUNDEN.rundeFertig();} finally{morphActionBusy=false;}
};

document.getElementById('btnOne').onclick = async ()=>{
  if(morphActionBusy || state.morphIndex==null || state.revealStep>=2) return; morphActionBusy=true;
  try{const {data,error}=await sb.rpc('party_buzzer_judge',{p_game:'morph',p_outcome:'one'}); if(error){console.error(error);return;} if(data?.state){state=data.state;render();} if(data?.accepted && state.revealStep>=2 && window.RUNDEN) await RUNDEN.rundeFertig();} finally{morphActionBusy=false;}
};

document.getElementById('btnWrong').onclick = async ()=>{
  if(morphActionBusy || state.morphIndex==null || state.revealStep>=2) return; morphActionBusy=true;
  try{const {data,error}=await sb.rpc('party_buzzer_judge',{p_game:'morph',p_outcome:'wrong'}); if(error){console.error(error);return;} if(data?.state){state=data.state;render();}} finally{morphActionBusy=false;}
};
</script>
<script src="../zurueck.js"></script>
<script src="../hintergrund.js"></script>



<script>
  if(window.SpielBeenden) SpielBeenden.init({
    format: 'morph',
    sammle: async function () {
      const { data } = await sb.from('mo_state').select('state').eq('id', 1).single();
      const players = (data && data.state && data.state.players) || {};
      return Object.entries(players).map(function (e) {
        return { spieler: e[0], punkte: e[1] };
      });
    }
  });
</script>

<script>
// Rundenlimit: legt fest, wie viele Runden dieses Format laeuft.
if(window.RUNDEN) RUNDEN.init({
  key: 'mo',
  state: function(){ return state; },
  speichern: async function(s){ state = s; await saveState(); },
  zaehler: function(s){ return (s.usedIndices || []).length; },
  reset: function(s){ s.usedIndices = []; },
  standard: 30
});
</script>

<script>
// Turnier: Rolle merken und auf Formatwechsel horchen.
// Schaltet der Spielleiter weiter, springt dieses Geraet mit.
if(window.TURNIER){
  TURNIER.setzeRolle('sl');
  TURNIER.starte(typeof sb !== "undefined" ? sb : null);
}
</script>
<script src="../active-stream-mode.js?v=48"></script>
</body>
</html>
