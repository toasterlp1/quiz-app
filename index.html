<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Quiz-App</title>
<meta name="theme-color" content="#0a0f1e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiz-App">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0f1e;
    --bg-card: #111a30;
    --bg-card-hover: #16223f;
    --border: #1e2a4a;
    --text: #eef1f8;
    --text-dim: #8b96b3;
    --accent: #ff4d4d;
    --gold: #f5c542;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }

  header {
    padding: 56px 24px 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: -120px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 300px;
    background: radial-gradient(ellipse at center, rgba(255, 77, 77, 0.12), transparent 70%);
    pointer-events: none;
  }

  h1 {
    font-family: 'Anton', sans-serif;
    font-size: clamp(2.6rem, 8vw, 4.5rem);
    letter-spacing: 2px;
    text-transform: uppercase;
    line-height: 1;
  }

  h1 span { color: var(--accent); }

  .tagline {
    margin-top: 12px;
    color: var(--text-dim);
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.5px;
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px;
  }

  .section-label {
    font-family: 'Anton', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 36px 4px 14px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
  }


  .session-admin {
    display:flex; align-items:center; justify-content:space-between; gap:24px;
    margin:0 0 30px; padding:22px 24px; border-radius:18px;
    background:linear-gradient(120deg,rgba(255,77,77,.12),rgba(245,197,66,.07)),var(--bg-card);
    border:1px solid rgba(255,77,77,.35);
    box-shadow:0 18px 45px -30px rgba(255,77,77,.5);
  }
  .session-admin-label { color:#ff6b6b; font-size:.7rem; font-weight:900; letter-spacing:2.5px; text-transform:uppercase; margin-bottom:5px; }
  .session-admin-title { font-family:'Anton',sans-serif; font-size:1.55rem; letter-spacing:.5px; }
  .session-admin-text { color:var(--text-dim); font-size:.82rem; line-height:1.45; max-width:650px; margin-top:5px; }
  #ka-end-session { flex-shrink:0; border:1px solid rgba(255,107,107,.5); border-radius:11px; padding:13px 16px; background:#35151d; color:#fff; font:800 13px Inter,sans-serif; cursor:pointer; }
  #ka-end-session:hover { background:#4a1924; border-color:#ff6b6b; }
  #ka-end-session:disabled { opacity:.6; cursor:wait; }
  @media (max-width:700px) { .session-admin { flex-direction:column; align-items:stretch; } #ka-end-session { width:100%; } }

  /* ---------- Lobby-Eingang: der Haupteingang, deutlich abgehoben
     von den einzelnen Format-Kacheln ---------- */
  .lobby-eingang {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 34px;
    padding: 26px 30px;
    border-radius: 18px;
    text-decoration: none;
    color: var(--text);
    background:
      linear-gradient(120deg, rgba(61,220,132,.16) 0%, rgba(77,159,255,.10) 100%),
      var(--bg-card);
    border: 1px solid rgba(61,220,132,.4);
    box-shadow: 0 0 0 1px rgba(61,220,132,.08), 0 20px 50px -24px rgba(61,220,132,.35);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .lobby-eingang:hover, .lobby-eingang:focus-visible {
    transform: translateY(-2px);
    border-color: rgba(61,220,132,.7);
    box-shadow: 0 0 0 1px rgba(61,220,132,.15), 0 26px 60px -22px rgba(61,220,132,.5);
  }
  .lobby-eingang-label {
    font-size: .72rem; letter-spacing: 2.5px; text-transform: uppercase;
    color: #3ddc84; font-weight: 800; margin-bottom: 6px;
  }
  .lobby-eingang-titel {
    font-family: 'Anton', sans-serif; font-size: 1.9rem; letter-spacing: .5px;
    margin-bottom: 6px;
  }
  .lobby-eingang-text {
    color: var(--text-dim); font-size: .92rem; max-width: 480px;
  }
  .lobby-eingang-pfeil {
    font-size: 1.8rem; color: #3ddc84; flex-shrink: 0;
    transition: transform .18s ease;
  }
  .lobby-eingang:hover .lobby-eingang-pfeil { transform: translateX(6px); }

  @media (max-width: 560px) {
    .lobby-eingang { flex-direction: column; align-items: flex-start; text-align: left; }
    .lobby-eingang-pfeil { display: none; }
  }

  .tile {
    display: block;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px 20px 18px;
    text-decoration: none;
    color: var(--text);
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    position: relative;
    overflow: hidden;
  }

  .tile::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: var(--tile-color, var(--accent));
    opacity: 0.9;
  }

  .tile:hover, .tile:focus-visible {
    transform: translateY(-3px);
    background: var(--bg-card-hover);
    border-color: var(--tile-color, var(--accent));
  }

  .tile:focus-visible {
    outline: 2px solid var(--tile-color, var(--accent));
    outline-offset: 2px;
  }

  .tile-name {
    font-family: 'Anton', sans-serif;
    font-size: 1.35rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .tile-desc {
    color: var(--text-dim);
    font-size: 0.85rem;
    line-height: 1.45;
  }

  .tile-wide {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }

  .tile-wide .tile-desc { flex: 1; min-width: 200px; }

  footer {
    text-align: center;
    margin-top: 48px;
    color: var(--text-dim);
    font-size: 0.8rem;
    letter-spacing: 0.5px;
  }

  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
    .tile:hover { transform: none; }
  }

  @media (max-width: 480px) {
    header { padding: 40px 20px 24px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .tile { padding: 16px 14px 14px; }
    .tile-name { font-size: 1.05rem; }
    .tile-desc { font-size: 0.75rem; }
  }
</style>
<link rel="stylesheet" href="responsive.css" />
</head>
<body>

  <h1>Quiz <span>App</span></h1>
</header>

<main>
<div class="section-label">Quiz-Formate</div>
  <div class="grid">

    </a>
    <a class="tile" href="hotzone/" style="--tile-color:#ff8a3d;">

    <a class="tile" href="higherlower/" style="--tile-color:#3ddc84;">

    <a class="tile" href="emoji/" style="--tile-color:#c44dff;">

  <div class="section-label">Party &amp; Deduktion</div>
  <div class="grid">

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./public-client.js"></script>
<script src="./crew.js"></script>
<script src="./pwa.js"></script>
<script src="./hintergrund.js"></script>
</body>
</html>
